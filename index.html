<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Links UTM</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f3f4f6;
      --surface:  #ffffff;
      --input-bg: #f9fafb;
      --border:   #e5e7eb;
      --accent:   #2563eb;
      --accent2:  #1d4ed8;
      --text:     #1f2937;
      --muted:    #6b7280;
      --success:  #16a34a;
      --error:    #dc2626;
      --radius:   10px;
      --font:     'Inter', system-ui, sans-serif;
    }

    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font); }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 40px; }

    .header-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent2);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .header h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p { margin-top: 10px; font-size: 14px; color: var(--muted); }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 1px 3px rgba(15,23,42,0.08), 0 8px 24px rgba(15,23,42,0.06);
    }

    /* ── Field wrapper ── */
    .fields { display: flex; flex-direction: column; gap: 24px; }

    .field { display: flex; flex-direction: column; gap: 8px; }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-label .param {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: var(--accent2);
      background: rgba(37,99,235,0.08);
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* ── Format cards (character select) ── */
    .format-grid {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .format-card {
      width: 124px;
      padding: 16px 10px 0;
      background: #1a1d27;
      border: 3px solid #2a2d3a;
      border-radius: 12px;
      cursor: pointer;
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .format-card:hover:not(.active) {
      border-color: #3d4356;
      transform: translateY(-2px);
    }

    .format-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.18), 0 0 18px rgba(37,99,235,0.45);
      transform: scale(1.05);
    }

    .format-img {
      height: 80px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    .format-img.fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      font-size: 40px;
    }

    .format-label {
      width: 100%;
      padding: 8px 4px;
      background: #0f1117;
      color: #7b7d8e;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      transition: background 0.15s, color 0.15s;
    }

    .format-card.active .format-label {
      background: var(--accent);
      color: #ffffff;
    }

    /* ── Text input ── */
    .field input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); opacity: 0.6; }

    /* Video ID feedback */
    .video-id-preview {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .video-id-preview.visible { display: flex; }

    .video-id-badge {
      background: rgba(22,163,74,0.08);
      border: 1px solid rgba(22,163,74,0.25);
      color: var(--success);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 6px;
    }

    .video-id-label { color: var(--muted); font-size: 11px; }

    .video-id-error { display: none; font-size: 11px; color: var(--error); }
    .video-id-error.visible { display: block; }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 24px 0; }

    /* ── Output ── */
    .output-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .output-box {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.8;
      min-height: 60px;
      transition: border-color 0.2s;
    }

    .output-box .url-base { color: var(--muted); }

    /* Caixa no modo "links gerados" */
    .output-box.links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-color: rgba(37,99,235,0.35);
    }

    .link-line { display: flex; align-items: baseline; gap: 8px; }

    .link-icon { flex-shrink: 0; }

    .link-tag { color: var(--text); font-weight: 700; flex-shrink: 0; }

    .link-url { min-width: 0; color: var(--muted); word-break: break-all; }

    .link-url .link-id { color: var(--accent2); font-weight: 700; }

    .btn-copy-all {
      align-self: flex-end;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent2);
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .btn-copy-all:hover { border-color: var(--accent); background: rgba(37,99,235,0.06); }

    .btn-copy-all.copied {
      color: var(--success);
      border-color: rgba(22,163,74,0.4);
      background: rgba(22,163,74,0.08);
    }

    /* ── Buttons ── */
    .btn-copy {
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-copy:hover:not(:disabled) { background: #1d4ed8; }
    .btn-copy:active:not(:disabled) { transform: scale(0.98); }
    .btn-copy.copied { background: var(--success); }
    .btn-copy:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-copy.loading {
      opacity: 0.7;
      pointer-events: none;
      cursor: wait;
    }

    .btn-copy .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-clear {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-family: var(--font);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-clear:hover { color: var(--text); border-color: var(--muted); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--success);
      color: white;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 30px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="page">

  <div class="header">
    <div class="header-badge">Futebol Máximo</div>
    <h1>Gerador de <span>Links UTM</span></h1>
    <p>Selecione o formato e cole o link do vídeo</p>
  </div>

  <div class="card">

    <!-- Fields -->
    <div class="fields">

      <!-- 1. FORMATO (utm_campaign) -->
      <div class="field">
        <div class="field-label">Formato <span class="param">utm_campaign</span></div>
        <div class="format-grid">
          <button type="button" class="format-card" id="btn-longform" onclick="setFormato('longform')">
            <img class="format-img" src="longform.png" alt="Long Form" onerror="imgFallback(this, '📹')">
            <span class="format-label">Long Form</span>
          </button>
          <button type="button" class="format-card" id="btn-shorts" onclick="setFormato('shorts')">
            <img class="format-img" src="shorts.png" alt="Shorts" onerror="imgFallback(this, '⚡')">
            <span class="format-label">Shorts</span>
          </button>
          <button type="button" class="format-card" id="btn-live" onclick="setFormato('live')">
            <img class="format-img" src="live.png" alt="Live" onerror="imgFallback(this, '🔴')">
            <span class="format-label">Live</span>
          </button>
        </div>
      </div>

      <!-- 2. LINK DO VÍDEO (utm_source) -->
      <div class="field">
        <div class="field-label">Link do Vídeo <span class="param">utm_source</span></div>
        <input
          id="videoLinkInput"
          type="text"
          placeholder="Cole o link do vídeo (ex: https://youtu.be/O5XWejP8yLg)"
          oninput="handleVideoLink(this.value)"
        />
        <div class="video-id-preview" id="videoIdPreview">
          <span class="video-id-label">ID detectado:</span>
          <span class="video-id-badge" id="videoIdBadge"></span>
        </div>
        <div class="video-id-error" id="videoIdError">
          Link inválido — cole um link do YouTube válido
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <!-- Output -->
    <div class="output-label">Link gerado</div>
    <div class="output-box" id="shortOutputBox">
      <span class="url-base">Preencha os campos acima e clique em gerar links</span>
    </div>

    <button class="btn-copy" id="btnCopy" onclick="gerarLinks()" disabled>
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Gerar Links
    </button>

    <button class="btn-clear" onclick="clearAll()">Limpar campos</button>

  </div>

</div>

<div class="toast" id="toast">✓ Link copiado!</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyUbXwgSErNeY-M2ZX6Ktk3AqraLVt4E4rdUlICtKq-iw0PSQAWAtP-AQzIrQ48B_dL/exec';
  const TRACKER_BASE_URL = 'https://futebolmaximo.github.io/go/t.html#';

  const BASES = {
    app: 'https://9fantasy.app/app',
    web: 'https://9fantasy.app/'
  };

  let selectedFormato = '';   // 'longform' | 'shorts' | 'live'
  let currentVideoId  = '';
  let linksGerados    = null; // { app, web } após gerar

  const GEN_BTN_DEFAULT_HTML = `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Gerar Links`;
  const GEN_BTN_LOADING_HTML = `<span class="spinner" aria-hidden="true"></span> Gerando links...`;
  const GEN_BTN_SUCCESS_HTML = `✅ Links Gerados`;

  const SMALL_BTN_DEFAULT_HTML = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar`;
  const SMALL_BTN_SUCCESS_HTML = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copiado`;

  // ── Init ──
  update();

  // Mostra um emoji no lugar da imagem enquanto os PNGs não existirem
  function imgFallback(img, emoji) {
    const div = document.createElement('div');
    div.className = 'format-img fallback';
    div.textContent = emoji;
    img.replaceWith(div);
  }

  // ── Formato ──
  function setFormato(val) {
    selectedFormato = val;
    document.getElementById('btn-longform').classList.toggle('active', val === 'longform');
    document.getElementById('btn-shorts').classList.toggle('active',   val === 'shorts');
    document.getElementById('btn-live').classList.toggle('active',     val === 'live');
    update();
  }

  // ── Video ID extraction ──
  function extractVideoId(url) {
    url = url.trim();
    if (!url) return null;
    const patterns = [
      /youtu\.be\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/watch\?.*v=([A-Za-z0-9_-]{11})/,
      /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/live\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/embed\/([A-Za-z0-9_-]{11})/,
      /^([A-Za-z0-9_-]{11})$/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function handleVideoLink(val) {
    const preview = document.getElementById('videoIdPreview');
    const badge   = document.getElementById('videoIdBadge');
    const error   = document.getElementById('videoIdError');

    if (!val.trim()) {
      currentVideoId = '';
      preview.classList.remove('visible');
      error.classList.remove('visible');
      update();
      return;
    }

    const id = extractVideoId(val);
    if (id) {
      currentVideoId = id;
      badge.textContent = id;
      preview.classList.add('visible');
      error.classList.remove('visible');
    } else {
      currentVideoId = '';
      preview.classList.remove('visible');
      error.classList.add('visible');
    }
    update();
  }

  // ── Build URL ──
  function buildUrl(destino) {
    const base = BASES[destino];
    const params = [
      ['source',        'youtube'],
      ['utm_source',    currentVideoId],
      ['utm_medium',    'futebolmaximo'],
    ];
    if (selectedFormato) params.push(['utm_campaign', selectedFormato]);

    const qs = params
      .filter(([, v]) => v)
      .map(([k, v]) => `${k}=${encodeURIComponent(v)}`)
      .join('&');

    return qs ? `${base}?${qs}` : '';
  }

  function update() {
    const btn = document.getElementById('btnCopy');
    if (btn.classList.contains('loading')) return;

    clearShortOutput();
    resetGenButton();
  }

  // ── Links gerados (saída) ──
  function renderLinks() {
    const box = document.getElementById('shortOutputBox');
    box.className = 'output-box links';
    box.innerHTML = `
      ${linkLine('📲', 'App:', linksGerados.app)}
      ${linkLine('💻', 'Web:', linksGerados.web)}
      <button class="btn-copy-all" onclick="copiarAmbos(this)">${SMALL_BTN_DEFAULT_HTML}</button>`;
  }

  function linkLine(icon, tag, shortId) {
    return `
      <div class="link-line">
        <span class="link-icon">${icon}</span>
        <span class="link-tag">${tag}</span>
        <span class="link-url">${TRACKER_BASE_URL}<span class="link-id">${shortId}</span></span>
      </div>`;
  }

  function clearShortOutput() {
    linksGerados = null;
    const box = document.getElementById('shortOutputBox');
    box.className = 'output-box';
    box.innerHTML = '<span class="url-base">Preencha os campos acima e clique em gerar links</span>';
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function resetGenButton() {
    const btn = document.getElementById('btnCopy');
    btn.classList.remove('loading', 'copied');
    btn.disabled = !(currentVideoId || selectedFormato);
    btn.innerHTML = GEN_BTN_DEFAULT_HTML;
  }

  // Estado verde persistente: só sai ao mudar um campo ou limpar
  function setGenSuccess() {
    const btn = document.getElementById('btnCopy');
    btn.classList.remove('loading');
    btn.classList.add('copied');
    btn.disabled = false;
    btn.innerHTML = GEN_BTN_SUCCESS_HTML;
  }

  // ── Encurtar uma URL via Apps Script ──
  async function encurtar(longUrl) {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao: 'encurtar', longUrl })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (!data || !data.shortId) throw new Error('Resposta sem shortId');

    return data.shortId;
  }

  // ── Gerar links (App + Web em paralelo) ──
  async function gerarLinks() {
    const urlApp = buildUrl('app');
    const urlWeb = buildUrl('web');
    if (!urlApp || !urlWeb) return;

    const btn = document.getElementById('btnCopy');
    btn.classList.add('loading');
    btn.classList.remove('copied');
    btn.disabled = true;
    btn.innerHTML = GEN_BTN_LOADING_HTML;

    try {
      const [shortIdApp, shortIdWeb] = await Promise.all([
        encurtar(urlApp),
        encurtar(urlWeb)
      ]);
      linksGerados = { app: shortIdApp, web: shortIdWeb };
      renderLinks();
      setGenSuccess();
      showToast('✓ Links gerados!');
    } catch (err) {
      console.error('Falha ao gerar links:', err);
      clearShortOutput();
      resetGenButton();
      showToast('Erro ao gerar os links');
    }
  }

  // ── Copiar os dois links de uma vez ──
  async function copiarAmbos(btnElement) {
    if (!linksGerados) return;

    const texto = `📲 App: ${TRACKER_BASE_URL}${linksGerados.app}\n💻 Web: ${TRACKER_BASE_URL}${linksGerados.web}`;

    try {
      await navigator.clipboard.writeText(texto);
      showToast('✓ Links copiados!');

      btnElement.classList.add('copied');
      btnElement.innerHTML = SMALL_BTN_SUCCESS_HTML;

      clearTimeout(btnElement._resetTimer);
      btnElement._resetTimer = setTimeout(() => {
        btnElement.classList.remove('copied');
        btnElement.innerHTML = SMALL_BTN_DEFAULT_HTML;
      }, 2000);
    } catch (err) {
      console.error('Falha ao copiar links:', err);
      showToast('Erro ao copiar os links');
    }
  }

  // ── Clear ──
  function clearAll() {
    selectedFormato = '';
    currentVideoId  = '';
    document.getElementById('btn-longform').classList.remove('active');
    document.getElementById('btn-shorts').classList.remove('active');
    document.getElementById('btn-live').classList.remove('active');
    document.getElementById('videoLinkInput').value = '';
    document.getElementById('videoIdPreview').classList.remove('visible');
    document.getElementById('videoIdError').classList.remove('visible');
    update();
  }
</script>

</body>
</html>
